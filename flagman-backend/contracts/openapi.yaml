openapi: 3.0.3
info:
  title: Flagman Restaurant Monitoring API
  version: 1.0.0
  description: API склада, заказов, поставок и мониторинга ресторана.
servers:
  - url: /api
security:
  - basicAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    OrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
    OrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderNumber: { type: string }
        status: { type: string, enum: [CREATED, COMPLETED, CANCELLED_OUT_OF_STOCK] }
        createdAt: { type: string, format: date-time }
        rejectionReason: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              dishId: { type: integer, format: int64 }
              dishName: { type: string }
              quantity: { type: integer }
        missingIngredients: { type: array, items: { type: object } }
paths:
  /dashboard:
    get:
      summary: Агрегаты главной страницы
      responses:
        '200': { description: DashboardDto }
  /admin/products:
    get:
      summary: Каталог продуктов (ADMIN)
      responses:
        '200': { description: "ProductDto[]" }
    post:
      summary: Создать продукт (ADMIN)
      responses:
        '201': { description: Созданный ProductDto }
  /admin/products/{id}:
    delete:
      summary: Удалить продукт без истории партий и связей с техкартами
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Удалён }
        '409': { description: Продукт связан с историей склада или техкартой }
  /admin/dishes:
    get:
      summary: Каталог блюд и техкарт (ADMIN)
      responses:
        '200': { description: "DishDto[]" }
  /warehouse/summary:
    get:
      summary: Доступные остатки по продуктам
      responses:
        '200': { description: "StockSummaryDto[]" }
  /warehouse/batches:
    get:
      summary: Партии склада
      responses:
        '200': { description: "BatchDto[]" }
  /warehouse/expiring:
    get:
      summary: Партии с приближающимся сроком годности
      parameters:
        - in: query
          name: hours
          schema: { type: integer, default: 48 }
      responses:
        '200': { description: "BatchDto[]" }
  /orders:
    get:
      summary: Список заказов
      responses:
        '200': { description: "OrderResponse[]" }
    post:
      summary: Создать заказ с проверкой стоп-листа и FIFO-списанием
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '409': { description: Заказ отклонён из-за доступности ингредиентов }
  /orders/{id}:
    get:
      summary: Получить заказ по ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OrderResponse }
  /orders/{id}/complete:
    patch:
      summary: Завершить заказ
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OrderResponse }
  /supplies:
    get:
      summary: История поставок, сгруппированная по supplyId
      responses:
        '200': { description: "SupplySummaryDto[]" }
    post:
      summary: Принять поставку и создать партии
      responses:
        '201': { description: "BatchDto[]" }
  /stop-list:
    get:
      summary: Текущий стоп-лист
      responses:
        '200': { description: "StopListItemDto[]" }
  /hot-offers:
    get:
      summary: Рекомендации по горячим предложениям
      responses:
        '200': { description: "HotOfferDto[]" }
  /analytics/write-offs:
    get:
      summary: Списания за период
      responses:
        '200': { description: "WriteOffStatDto[]" }
  /events/stream:
    get:
      summary: SSE-события изменений склада
      responses:
        '200': { description: text/event-stream }
