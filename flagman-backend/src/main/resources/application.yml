
spring:
  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:flagman;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  expiring-hours: 48
  hot-horizon-hours: 72

  users:
    admin-password: ${ADMIN_PASSWORD:admin123}
    staff-password: ${STAFF_PASSWORD:staff123}
