spring:
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:mem:flagman;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # Для PostgreSQL: задайте SPRING_DATASOURCE_URL / USERNAME / PASSWORD переменными окружения

app:
  expiring-hours: 48        # партия считается "истекающей", если до срока меньше N часов
  hot-horizon-hours: 72     # горизонт для расчёта горячих предложений
  users:
    admin-password: ${ADMIN_PASSWORD:admin123}
    staff-password: ${STAFF_PASSWORD:staff123}
