spring:
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:flagman;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

app:
  expiring-hours: 48
  hot-horizon-hours: 72
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
